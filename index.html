<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магический Кликер</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="game-container">
    <div class="language-switcher">
        <button class="lang-btn active" data-lang="ru" title="Русский">🇷🇺</button>
        <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
    </div>

    <div class="header">
        <h1 id="gameTitle">✨ Магический Кликер</h1>
        <p id="gameSubtitle">Собирай ману и становись великим волшебником!</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-label" id="manaLabel">💎 Мана</div>
            <div class="stat-value" id="money">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label" id="clickPowerLabel">⚡ Сила клика</div>
            <div class="stat-value" id="clickPower">1</div>
        </div>
        <div class="stat-card">
            <div class="stat-label" id="passiveIncomeLabel">🌟 Мана/сек</div>
            <div class="stat-value" id="passiveIncome">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label" id="totalEarnedLabel">📊 Всего маны</div>
            <div class="stat-value" id="totalEarned">0</div>
        </div>
    </div>

    <div class="click-area">
        <button class="click-button" id="clickButton">🔮</button>
        <button class="monster-btn" id="monsterButton">⚔️ Сразиться с монстром</button>
    </div>

    <div class="section">
        <div class="section-title" id="ranksTitle">📜 Магические ранги</div>
        <div class="upgrade-list" id="professionsList"></div>
    </div>

    <div class="section">
        <div class="section-title" id="artifactsTitle">⚡ Артефакты</div>
        <div class="upgrade-list" id="perksList"></div>
    </div>

    <div class="section" id="fragmentsSection" style="display: none;">
        <div class="section-title" id="fragmentsTitle">💎 Фрагменты</div>
        <div class="fragments-list" id="fragmentsList"></div>
    </div>

    <div class="section" id="prestigeSection">
        <div class="section-title" id="prestigeTitle">🔮 Перерождение</div>
        <div class="prestige-info" id="prestigeInfo"></div>
        <button class="prestige-btn" id="prestigeButton">🔮 Переродиться</button>
    </div>

    <div class="button-container">
        <button class="save-button" id="saveButton">💾 Сохранить</button>
        <button class="export-button" id="exportButton">📤 Экспорт</button>
        <button class="import-button" id="importButton">📥 Импорт</button>
        <button class="reset-button" id="resetButton">🗑️ Сбросить</button>
        <input type="file" id="importFile" accept=".json" style="display: none;">
    </div>

    <div class="storage-info">
        <p id="storageInfo">Данные сохраняются в вашем браузере (localStorage)</p>
    </div>
</div>

<div class="save-indicator" id="saveIndicator">✨ Сохранено!</div>

<script src="js/i18n.js"></script>
<script src="js/config.js"></script>
<script src="js/saveManager.js"></script>
<script src="js/minigames.js"></script>
<script src="js/prestige.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
